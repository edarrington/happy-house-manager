{% if message %}
<div class="mt-5 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
  <!-- Message header -->
  <div class="px-6 py-4 border-b border-slate-100">
    <div class="flex items-start justify-between gap-4">
      <h2 class="text-base font-semibold text-slate-900">{{ message.subject }}</h2>
      <button
        onclick="this.closest('.bg-white').remove()"
        class="text-slate-400 hover:text-slate-600 flex-shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="mt-2 space-y-0.5">
      <p class="text-xs text-slate-500"><span class="font-medium">From:</span> {{ message.from }}</p>
      <p class="text-xs text-slate-500"><span class="font-medium">To:</span> {{ message.to }}</p>
      <p class="text-xs text-slate-500"><span class="font-medium">Date:</span> {{ message.date }}</p>
    </div>
  </div>
  <!-- Message body -->
  <div class="px-6 py-5">
    <pre class="whitespace-pre-wrap text-sm text-slate-700 font-sans leading-relaxed">{{ message.body }}</pre>
  </div>
</div>
{% else %}
<div class="mt-5 rounded-xl bg-red-50 border border-red-200 px-5 py-4 text-sm text-red-700">
  Failed to load message.
</div>
{% endif %}
