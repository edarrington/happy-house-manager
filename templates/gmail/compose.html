<!-- Compose modal overlay -->
<div class="fixed inset-0 bg-black bg-opacity-40 z-50 flex items-end sm:items-center justify-center p-4"
     id="compose-modal">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <h2 class="font-semibold text-slate-900">New Message</h2>
      <button
        onclick="document.getElementById('compose-modal').remove()"
        class="text-slate-400 hover:text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Form -->
    <form
      hx-post="/gmail/send"
      hx-target="#compose-modal"
      hx-swap="outerHTML"
      hx-indicator="#global-loading"
      class="px-6 py-4 space-y-4">

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">To</label>
        <input type="email" name="to" required
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Cc (optional)</label>
        <input type="email" name="cc"
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Subject</label>
        <input type="text" name="subject" required
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Message</label>
        <textarea name="body" rows="6" required
                  class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent resize-none"></textarea>
      </div>

      <div class="flex items-center justify-end gap-3 pt-1">
        <button type="button"
                onclick="document.getElementById('compose-modal').remove()"
                class="text-sm text-slate-600 hover:text-slate-800 px-4 py-2 rounded-lg hover:bg-slate-100 transition-colors">
          Cancel
        </button>
        <button type="submit"
                class="bg-green-500 hover:bg-green-600 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">
          Send
        </button>
      </div>
    </form>
  </div>
</div>
