{% extends "base.html" %}
{% block title %}Tyrone — Happy House{% endblock %}
{% block page_title %}Tyrone{% endblock %}

{% block header_actions %}
<div class="flex items-center gap-2 text-sm">
  <span id="hdr-time" class="font-medium text-slate-700 dark:text-slate-200 tabular-nums"></span>
  <span class="text-slate-300 dark:text-slate-600">&bull;</span>
  <span id="hdr-temp" class="text-slate-500 dark:text-slate-400">—</span>
</div>
{% endblock %}

{% block content %}
<div style="display:grid; grid-template-columns:1fr 360px; gap:1.5rem; align-items:start;">

  <!-- Left: Tyrone voice + chat -->
  <div class="flex flex-col items-center min-h-[70vh]">

    <!-- Status + mic -->
    <div class="flex flex-col items-center justify-center flex-1 select-none pt-8">
      <p id="status-text" class="text-sm text-slate-400 mb-10 tracking-wide uppercase font-medium">
        Click to start
      </p>

      <button id="mic-btn"
        class="relative w-28 h-28 rounded-full bg-slate-800 border-2 border-slate-600 flex items-center justify-center transition-all duration-300 hover:border-green-500 focus:outline-none"
        onclick="toggleVoice()">
        <span id="pulse-ring"
          class="hidden absolute inset-0 rounded-full bg-green-500 opacity-20 animate-ping"></span>
        <svg id="mic-icon" class="w-10 h-10 text-slate-300 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
        </svg>
      </button>

      <p id="interim-text" class="mt-6 text-slate-500 text-sm italic min-h-5 max-w-sm text-center"></p>
    </div>

    <!-- Chat area -->
    <div class="w-full max-w-lg mt-6">
      <div id="conversation" class="space-y-3 min-h-[80px] max-h-64 overflow-y-auto mb-3 px-1"></div>

      <!-- Text input -->
      <form id="chat-form" onsubmit="submitText(event)"
        class="flex items-center gap-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-2 shadow-sm">
        <input id="chat-input" type="text" placeholder="Type a message&hellip;"
          autocomplete="off"
          class="flex-1 bg-transparent text-sm text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 outline-none" />
        <button type="submit"
          class="flex-shrink-0 w-8 h-8 bg-green-500 hover:bg-green-600 rounded-full flex items-center justify-center transition-colors">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </form>
    </div>

  </div>

  <!-- Right: Shopping list -->
  <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm overflow-hidden sticky top-6">

    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100 dark:border-slate-700">
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
        <h2 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Shopping List</h2>
      </div>
      <button
        class="text-xs text-slate-400 hover:text-red-400 transition-colors"
        hx-delete="/voice/shopping"
        hx-target="#shopping-list-body"
        hx-swap="innerHTML"
        title="Clear completed">
        Clear done
      </button>
    </div>

    <!-- Manual add -->
    <div class="px-3 pt-3 pb-2 border-b border-slate-100 dark:border-slate-700">
      <form id="add-item-form" onsubmit="addShoppingItem(event)"
        class="flex items-center gap-2">
        <input id="add-item-input" type="text" placeholder="Add an item…" autocomplete="off"
          class="flex-1 text-sm bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-1.5 text-slate-800 dark:text-white placeholder-slate-400 outline-none focus:ring-1 focus:ring-green-500" />
        <button type="submit"
          class="w-7 h-7 bg-green-500 hover:bg-green-600 rounded-lg flex items-center justify-center transition-colors flex-shrink-0">
          <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
          </svg>
        </button>
      </form>
    </div>

    <!-- Items -->
    <div id="shopping-list-body"
      class="px-1 py-1 max-h-[60vh] overflow-y-auto"
      hx-get="/voice/shopping"
      hx-trigger="load"
      hx-swap="innerHTML">
      <p class="text-slate-400 text-sm text-center py-6">Loading…</p>
    </div>

  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  // --- Clock ---
  const timeEl = document.getElementById('hdr-time');
  function updateClock() {
    const now = new Date();
    timeEl.textContent = now.toLocaleTimeString('en-US', {
      hour: 'numeric', minute: '2-digit', hour12: true,
      timeZone: 'America/Los_Angeles'
    });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // --- Weather ---
  const tempEl = document.getElementById('hdr-temp');
  async function loadWeather() {
    try {
      const res = await fetch('/voice/weather');
      if (!res.ok) return;
      const data = await res.json();
      if (data.temp != null) {
        tempEl.textContent = `${data.temp}\u00b0F`;
        tempEl.title = data.condition || '';
      }
    } catch(e) {}
  }
  loadWeather();
  setInterval(loadWeather, 10 * 60 * 1000);

  // --- Reload shopping list after Tyrone responds ---
  window.reloadShoppingList = function() {
    htmx.trigger('#shopping-list-body', 'load');
  };

  // --- Manual add item ---
  window.addShoppingItem = async function(e) {
    e.preventDefault();
    const input = document.getElementById('add-item-input');
    const content = input.value.trim();
    if (!content) return;
    input.value = '';
    const res = await fetch('/voice/shopping/item', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    if (res.ok) {
      document.getElementById('shopping-list-body').innerHTML = await res.text();
    }
  };

  // --- Voice assistant ---
  const STATE = { IDLE: 'idle', LISTENING: 'listening', PROCESSING: 'processing', SPEAKING: 'speaking' };
  let state = STATE.IDLE;
  let recognition = null;
  let audioCtx = null;
  let currentSource = null;
  let history = [];
  let active = false;

  const micBtn = document.getElementById('mic-btn');
  const pulseRing = document.getElementById('pulse-ring');
  const micIcon = document.getElementById('mic-icon');
  const statusText = document.getElementById('status-text');
  const interimText = document.getElementById('interim-text');
  const conversation = document.getElementById('conversation');
  const chatInput = document.getElementById('chat-input');

  function unlockAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function setState(s) {
    state = s;
    pulseRing.classList.toggle('hidden', s !== STATE.LISTENING);
    micBtn.classList.toggle('border-green-500', s !== STATE.IDLE);
    micBtn.classList.toggle('border-red-500', s === STATE.PROCESSING || s === STATE.SPEAKING);
    micIcon.classList.toggle('text-green-400', s === STATE.LISTENING);
    micIcon.classList.toggle('text-red-400', s === STATE.PROCESSING || s === STATE.SPEAKING);
    micIcon.classList.toggle('text-slate-300', s === STATE.IDLE);
    const labels = {
      [STATE.IDLE]: 'Click to start',
      [STATE.LISTENING]: 'Listening\u2026',
      [STATE.PROCESSING]: 'Thinking\u2026',
      [STATE.SPEAKING]: 'Speaking\u2026',
    };
    statusText.textContent = labels[s];
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';
    const bubble = document.createElement('div');
    bubble.className = role === 'user'
      ? 'bg-slate-700 text-white text-sm px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-xs'
      : 'bg-green-500 text-white text-sm px-4 py-2.5 rounded-2xl rounded-tl-sm max-w-xs';
    bubble.textContent = text;
    div.appendChild(bubble);
    conversation.appendChild(div);
    conversation.scrollTop = conversation.scrollHeight;
  }

  function setupRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      statusText.textContent = 'Speech recognition not supported in this browser';
      micBtn.disabled = true;
      return null;
    }
    const r = new SR();
    r.continuous = false;
    r.interimResults = true;
    r.lang = 'en-US';
    r.onstart = () => setState(STATE.LISTENING);
    r.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      interimText.textContent = interim || final;
      if (final) sendToTyrone(final.trim());
    };
    r.onerror = (e) => { if (e.error === 'no-speech' && active) r.start(); };
    r.onend = () => { if (active && state === STATE.LISTENING) r.start(); };
    return r;
  }

  async function playAudio(base64Audio) {
    setState(STATE.SPEAKING);
    if (currentSource) { try { currentSource.stop(); } catch(e) {} currentSource = null; }
    try {
      const binary = atob(base64Audio);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const buffer = await audioCtx.decodeAudioData(bytes.buffer);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      currentSource = source;
      source.onended = () => { currentSource = null; if (active) restartListening(); };
      source.start(0);
    } catch(e) {
      console.error('Audio playback failed:', e);
      if (active) restartListening();
    }
  }

  function restartListening() {
    if (!active || !recognition) return;
    setState(STATE.LISTENING);
    try { recognition.start(); } catch(e) {}
  }

  async function sendToTyrone(transcript, skipAudio) {
    if (!transcript) return;
    setState(STATE.PROCESSING);
    interimText.textContent = '';
    addMessage('user', transcript);
    chatInput.value = '';
    try {
      const res = await fetch('/voice/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transcript, history }),
      });
      const data = await res.json();
      const reply = data.response || '';
      if (reply) {
        history.push({ role: 'user', content: transcript });
        history.push({ role: 'assistant', content: reply });
        if (history.length > 20) history = history.slice(-20);
        addMessage('assistant', reply);
        // Refresh shopping list in case Tyrone added items
        reloadShoppingList();
        if (!skipAudio && data.audio_b64 && audioCtx) {
          await playAudio(data.audio_b64);
        } else {
          setState(STATE.IDLE);
          if (active) restartListening();
        }
      } else {
        setState(STATE.IDLE);
        if (active) restartListening();
      }
    } catch(err) {
      console.error('Tyrone error:', err);
      setState(STATE.IDLE);
      if (active) restartListening();
    }
  }

  window.submitText = function(e) {
    e.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;
    sendToTyrone(text, true);
  };

  window.toggleVoice = function() {
    if (!active) {
      unlockAudio();
      active = true;
      recognition = setupRecognition();
      if (!recognition) { active = false; return; }
      recognition.start();
    } else {
      active = false;
      if (currentSource) { try { currentSource.stop(); } catch(e) {} currentSource = null; }
      window.speechSynthesis.cancel();
      if (recognition) { recognition.stop(); recognition = null; }
      setState(STATE.IDLE);
      interimText.textContent = '';
    }
  };
})();
</script>
{% endblock %}
