<!-- New Task Modal -->
<div class="fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4"
     id="task-modal">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <h2 class="font-semibold text-slate-900">New Task</h2>
      <button onclick="document.getElementById('task-modal').remove()" class="text-slate-400 hover:text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form
      hx-post="/tasks/"
      hx-target="#task-result"
      hx-swap="innerHTML"
      hx-on::after-request="document.getElementById('task-modal').remove()"
      class="px-6 py-5 space-y-4">

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Task *</label>
        <input type="text" name="content" required autofocus
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Project</label>
        <select name="project_id"
                class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
          <option value="">No project</option>
          {% for project in projects %}
            <option value="{{ project.id }}">{{ project.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Due date</label>
        <input type="text" name="due_string" placeholder="e.g. tomorrow, next Monday"
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Priority</label>
        <select name="priority"
                class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
          <option value="1">Normal (P1)</option>
          <option value="2">Medium (P2)</option>
          <option value="3">High (P3)</option>
          <option value="4">Urgent (P4)</option>
        </select>
      </div>

      <div class="flex justify-end gap-3 pt-1">
        <button type="button" onclick="document.getElementById('task-modal').remove()"
                class="text-sm text-slate-600 hover:text-slate-800 px-4 py-2 rounded-lg hover:bg-slate-100 transition-colors">
          Cancel
        </button>
        <button type="submit"
                class="bg-green-500 hover:bg-green-600 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">
          Create Task
        </button>
      </div>
    </form>
  </div>
</div>
