version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: happy-house-backend
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - happy-house-net

  frontend:
    image: node:18-alpine
    container_name: happy-house-frontend
    working_dir: /app
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c 'npm install && npm run dev'
    depends_on:
      - backend
    networks:
      - happy-house-net

networks:
  happy-house-net:
    driver: bridge
